name: Security and regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: orbit_saas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2 (Node.js 24)
        with:
          php-version: '8.2'
          extensions: gd, fileinfo, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies and check advisories
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run MySQL regression suite and compile views
        run: |
          php artisan test --compact
          php artisan view:cache
